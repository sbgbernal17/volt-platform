apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ocpp-gateway
  namespace: volt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ocpp-gateway
  minReplicas: ${GATEWAY_REPLICAS}
  maxReplicas: ${GATEWAY_MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Reducir despacio: cada pod que se retira cierra sus sockets y provoca reconexiones.
      stabilizationWindowSeconds: 1800
      policies:
        - type: Pods
          value: 1
          periodSeconds: 600
