apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocpp-gateway
  namespace: volt
  labels:
    app.kubernetes.io/name: ocpp-gateway
    app.kubernetes.io/part-of: volt
spec:
  replicas: ${GATEWAY_REPLICAS}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ocpp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocpp-gateway
        app.kubernetes.io/part-of: volt
      annotations:
        # Pods de larga duración en Autopilot: sin desalojos por escalado o actualización de nodos
        # durante hasta 7 días (OPS §4.8).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: ocpp-gateway
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        # Usuario de la imagen (UID fijo en el Dockerfile).
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ocpp-gateway
          image: ocpp-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: ocpp
              containerPort: 9220
            - name: health
              containerPort: 9221
            - name: internal
              containerPort: 9222
          env:
            - name: NODE_ENV
              value: production
            - name: VOLT_ENV
              value: ${VOLT_ENV}
            - name: LOG_LEVEL
              value: info
            - name: OCPP_GATEWAY_HOST
              value: 0.0.0.0
            - name: OCPP_GATEWAY_PORT
              value: "9220"
            - name: OCPP_GATEWAY_HEALTH_PORT
              value: "9221"
            - name: OCPP_GATEWAY_INTERNAL_PORT
              value: "9222"
            - name: OCPP_PING_INTERVAL_S
              value: "30"
            - name: OCPP_HEARTBEAT_INTERVAL_S
              value: "300"
            - name: OCPP_DRAIN_RATE_PER_S
              value: "50"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OCPP_GATEWAY_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL_FILE
              value: /secrets/database-url
            - name: DATABASE_SSL_CA_FILE
              value: /secrets/db-server-ca
            - name: REDIS_URL_FILE
              value: /secrets/redis-url
            - name: OCPP_GATEWAY_INTERNAL_TOKEN_FILE
              value: /secrets/ocpp-gateway-internal-token
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: ${GATEWAY_CPU}
              memory: ${GATEWAY_MEMORY}
              ephemeral-storage: 512Mi
            limits:
              cpu: ${GATEWAY_CPU}
              memory: ${GATEWAY_MEMORY}
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # El balanceador deja de enviar conexiones nuevas (readiness 503) antes de que
                # SIGTERM cierre las existentes a ritmo constante.
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ocpp-gateway-secrets
