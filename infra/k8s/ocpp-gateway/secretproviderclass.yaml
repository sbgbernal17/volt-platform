# Secretos de Secret Manager montados como archivos (complemento de GKE); el gateway los lee por
# las variables *_FILE (ADR 0023).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ocpp-gateway-secrets
  namespace: volt
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_NUMBER}/secrets/database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/${PROJECT_NUMBER}/secrets/db-server-ca/versions/latest"
        path: "db-server-ca"
      - resourceName: "projects/${PROJECT_NUMBER}/secrets/redis-url/versions/latest"
        path: "redis-url"
      - resourceName: "projects/${PROJECT_NUMBER}/secrets/ocpp-gateway-internal-token/versions/latest"
        path: "ocpp-gateway-internal-token"
