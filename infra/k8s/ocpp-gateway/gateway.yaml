# Balanceador de aplicación global para los cargadores (Gateway API de GKE). IP estática,
# certificado gestionado por Google (clásico) y política SSL vienen de Terraform.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ocpp
  namespace: volt
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: ${OCPP_ADDRESS_NAME}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # Certificado clásico gestionado por Google creado por Terraform (ADR 0023): el controlador
        # de GKE lo adjunta al proxy HTTPS; se emite cuando el DNS apunta a la IP.
        options:
          networking.gke.io/pre-shared-certs: ${OCPP_SSL_CERTIFICATE}
      allowedRoutes:
        namespaces:
          from: Same
