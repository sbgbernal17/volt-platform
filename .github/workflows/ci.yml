name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://volt:volt@localhost:5432/volt
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt
          POSTGRES_DB: volt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volt -d volt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Prueba opcional contra el sandbox de Wompi (apps/api/src/wompi.sandbox.test.ts): solo corre si existen.
          WOMPI_PUBLIC_KEY_TEST: ${{ secrets.WOMPI_PUBLIC_KEY_TEST }}
          WOMPI_PRIVATE_KEY_TEST: ${{ secrets.WOMPI_PRIVATE_KEY_TEST }}
          WOMPI_INTEGRITY_SECRET_TEST: ${{ secrets.WOMPI_INTEGRITY_SECRET_TEST }}
          WOMPI_EVENTS_SECRET_TEST: ${{ secrets.WOMPI_EVENTS_SECRET_TEST }}
      # Solo comprueba que existen (nunca imprime valores): avisa si falta alguno de los
      # secretos de Wompi o de las variables de Google Cloud que usan las iteraciones 5 y 8.
      - name: Comprobar secretos y variables configurados
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WOMPI_PUBLIC_KEY_TEST: ${{ secrets.WOMPI_PUBLIC_KEY_TEST }}
          WOMPI_PRIVATE_KEY_TEST: ${{ secrets.WOMPI_PRIVATE_KEY_TEST }}
          WOMPI_INTEGRITY_SECRET_TEST: ${{ secrets.WOMPI_INTEGRITY_SECRET_TEST }}
          WOMPI_EVENTS_SECRET_TEST: ${{ secrets.WOMPI_EVENTS_SECRET_TEST }}
          GCP_PROJECT_ID_DEV: ${{ vars.GCP_PROJECT_ID_DEV }}
          GCP_PROJECT_ID_STAGING: ${{ vars.GCP_PROJECT_ID_STAGING }}
          GCP_PROJECT_ID_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          GCP_WIF_PROVIDER_DEV: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          GCP_WIF_PROVIDER_STAGING: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
          GCP_WIF_PROVIDER_PROD: ${{ vars.GCP_WIF_PROVIDER_PROD }}
          GCP_DEPLOYER_SA_DEV: ${{ vars.GCP_DEPLOYER_SA_DEV }}
          GCP_DEPLOYER_SA_STAGING: ${{ vars.GCP_DEPLOYER_SA_STAGING }}
          GCP_DEPLOYER_SA_PROD: ${{ vars.GCP_DEPLOYER_SA_PROD }}
        run: |
          missing=0
          for name in WOMPI_PUBLIC_KEY_TEST WOMPI_PRIVATE_KEY_TEST WOMPI_INTEGRITY_SECRET_TEST WOMPI_EVENTS_SECRET_TEST \
                      GCP_PROJECT_ID_DEV GCP_PROJECT_ID_STAGING GCP_PROJECT_ID_PROD \
                      GCP_WIF_PROVIDER_DEV GCP_WIF_PROVIDER_STAGING GCP_WIF_PROVIDER_PROD \
                      GCP_DEPLOYER_SA_DEV GCP_DEPLOYER_SA_STAGING GCP_DEPLOYER_SA_PROD; do
            if [ -n "${!name}" ]; then
              echo "$name: configurado"
            else
              echo "::warning::$name no configurado"
              missing=$((missing + 1))
            fi
          done
          echo "Faltan $missing de 13 (aviso informativo; no bloquea la ejecución)."

  docker:
    name: Construir imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    strategy:
      matrix:
        app: [ocpp-gateway, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: volt/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
