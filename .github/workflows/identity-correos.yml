# Plantillas de correo de Identity Platform con la identidad VOLT (iteración 9, ADR 0024):
# verificación de correo, contraseña nueva, cambio de correo y segundo factor, con la página propia
# de la app web (/auth/action) como destino de los enlaces. Se aplica por ambiente con la API de
# administración de Identity Toolkit; el flujo no imprime cuerpos ni tokens.
name: Correos de identidad (plantillas VOLT)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente'
        type: choice
        default: dev
        options: [dev, staging, prod]
      dry_run:
        description: 'Solo mostrar el estado actual y el cuerpo que se enviaría (sin aplicar)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: identity-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  apply:
    name: Plantillas (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Variables del ambiente
        id: vars
        run: |
          suffix=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "app_host=app.supercargadores.co" >> "$GITHUB_OUTPUT"
            echo "admin_host=admin.supercargadores.co" >> "$GITHUB_OUTPUT"
          else
            echo "app_host=app-${ENVIRONMENT}.supercargadores.co" >> "$GITHUB_OUTPUT"
            echo "admin_host=admin-${ENVIRONMENT}.supercargadores.co" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticación (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', steps.vars.outputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', steps.vars.outputs.suffix)] }}
          project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construir la configuración
        env:
          APP_HOST: ${{ steps.vars.outputs.app_host }}
          ADMIN_HOST: ${{ steps.vars.outputs.admin_host }}
        run: |
          set -euo pipefail
          node infra/identity/build-config.mjs --app-host "$APP_HOST" --admin-host "$ADMIN_HOST" > "$RUNNER_TEMP/config.json"
          jq -r '.updateMask' "$RUNNER_TEMP/config.json"
          jq '.body.notification.sendEmail | with_entries(if (.value | type) == "object" then .value |= {subject, senderDisplayName, bodyFormat, bodyChars: (.body | length)} else . end)' "$RUNNER_TEMP/config.json"

      - name: Estado actual
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
        run: |
          set -euo pipefail
          token=$(gcloud auth print-access-token)
          curl -sS -f -H "Authorization: Bearer $token" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config" > "$RUNNER_TEMP/current.json"
          echo "## Estado actual (${ENVIRONMENT})" >> "$GITHUB_STEP_SUMMARY"
          jq '{callbackUri: .notification.sendEmail.callbackUri, method: .notification.sendEmail.method, dnsInfo: .notification.sendEmail.dnsInfo, authorizedDomains, templates: (.notification.sendEmail | with_entries(select(.value | type == "object" and has("subject"))) | map_values({subject, senderDisplayName, customized, bodyFormat}))}' \
            "$RUNNER_TEMP/current.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Aplicar dominios autorizados, plantillas y página de acción
        if: ${{ !inputs.dry_run }}
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
        run: |
          set -euo pipefail
          token=$(gcloud auth print-access-token)
          base="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config"
          patch() { # título archivo updateMask
            code=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" --data @"$2" "$base?updateMask=$3")
            if [ "$code" != "200" ]; then
              msg=$(jq -r '.error.message // .message // (. | tostring)' "$RUNNER_TEMP/resp.json" 2>/dev/null | head -c 700)
              if [ "$msg" = "EMAIL_TEMPLATE_UPDATE_NOT_ALLOWED" ]; then echo "$1: la API no lo permite ($msg)"; else echo "::error title=$1::HTTP $code $msg"; fi
              return 1
            fi
            cp "$RUNNER_TEMP/resp.json" "$RUNNER_TEMP/after.json"
            echo "$1: aplicado"
          }
          # 1. Dominios autorizados primero: la página de acción debe vivir en un dominio autorizado.
          jq -n --slurpfile current "$RUNNER_TEMP/current.json" --slurpfile wanted "$RUNNER_TEMP/config.json" \
            '{authorizedDomains: (($current[0].authorizedDomains // []) + $wanted[0].authorizedDomains | unique)}' > "$RUNNER_TEMP/domains.json"
          if jq -e --slurpfile current "$RUNNER_TEMP/current.json" '.authorizedDomains == (($current[0].authorizedDomains // []) | unique)' "$RUNNER_TEMP/domains.json" >/dev/null; then
            echo "Dominios autorizados: al día"
          else
            patch "Dominios autorizados" "$RUNNER_TEMP/domains.json" authorizedDomains
          fi
          # 2. Plantillas completas (cuerpo HTML con la marca), remitente y página de acción.
          mask=$(jq -r '.updateMask' "$RUNNER_TEMP/config.json")
          jq '.body' "$RUNNER_TEMP/config.json" > "$RUNNER_TEMP/body.json"
          if patch "Plantillas completas y página de acción" "$RUNNER_TEMP/body.json" "$mask"; then
            echo "cuerpo=html" >> "$GITHUB_OUTPUT"
          else
            # Identity Platform no permite cambiar el cuerpo en este proyecto (EMAIL_TEMPLATE_UPDATE_NOT_ALLOWED):
            # se aplican remitente, asuntos y página de acción, que sí admite.
            jq '.bodyHeadersOnly' "$RUNNER_TEMP/config.json" > "$RUNNER_TEMP/body-sin-html.json"
            if patch "Remitente, asuntos y página de acción (sin cuerpo HTML)" "$RUNNER_TEMP/body-sin-html.json" "$mask"; then
              echo "::warning title=Cuerpo de los correos no personalizado::Identity Platform rechazó el cuerpo HTML (EMAIL_TEMPLATE_UPDATE_NOT_ALLOWED). Quedaron aplicados el remitente VOLT, los asuntos en español y la página de acción propia; el cuerpo sigue siendo el de Google."
            else
              # La API tampoco admite remitente ni asunto por esta vía: solo la página de acción. Remitente y
              # asuntos se cambian en la consola de Firebase (tarea del dueño 9b).
              jq '{notification: {sendEmail: {callbackUri: .notification.sendEmail.callbackUri}}}' "$RUNNER_TEMP/body.json" > "$RUNNER_TEMP/body-callback.json"
              if patch "Página de acción" "$RUNNER_TEMP/body-callback.json" notification.sendEmail.callbackUri; then
                echo "::warning title=Plantillas no personalizables por la API::Identity Platform rechazó remitente, asuntos y cuerpo (EMAIL_TEMPLATE_UPDATE_NOT_ALLOWED). Quedó aplicada la página de acción propia; remitente y asuntos se cambian en la consola de Firebase (Authentication → Templates)."
              else
                # Google no admite ningún cambio de estas plantillas por la API en este proyecto: se hace en la
                # consola de Firebase (Authentication → Templates: nombre del remitente, asunto y URL de acción).
                cp "$RUNNER_TEMP/current.json" "$RUNNER_TEMP/after.json"
                callback=$(jq -r '.body.notification.sendEmail.callbackUri' "$RUNNER_TEMP/config.json")
                echo "::warning title=Plantillas solo desde la consola de Firebase::Identity Platform respondió EMAIL_TEMPLATE_UPDATE_NOT_ALLOWED a todos los cambios (cuerpo, remitente, asunto y URL de acción). En la consola de Firebase del proyecto ${PROJECT_ID} → Authentication → Templates: nombre del remitente VOLT, asuntos de infra/identity/config.json y URL de acción ${callback}. Los dominios autorizados sí quedaron al día."
              fi
            fi
          fi
          echo "## Resultado (${ENVIRONMENT})" >> "$GITHUB_STEP_SUMMARY"
          jq '{callbackUri: .notification.sendEmail.callbackUri, authorizedDomains, templates: (.notification.sendEmail | with_entries(select(.value | type == "object" and has("subject"))) | map_values({subject, senderDisplayName, customized}))}' \
            "$RUNNER_TEMP/after.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Correos de identidad (${ENVIRONMENT})::$(jq -c '{callbackUri: .notification.sendEmail.callbackUri, subjects: (.notification.sendEmail | with_entries(select(.value | type == "object" and has("subject"))) | map_values(.subject))}' "$RUNNER_TEMP/after.json")"
