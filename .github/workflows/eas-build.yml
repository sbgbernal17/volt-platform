# Compilación de la app Volt con EAS Build desde GitHub Actions (iteración 7, ADR 0022). Se lanza a
# mano (Run workflow) con el perfil y la plataforma; necesita el secreto EXPO_TOKEN (token de acceso de
# la cuenta de Expo). Las credenciales de las tiendas viven cifradas en EAS, nunca aquí.
name: Compilación de la app (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de eas.json'
        type: choice
        default: preview
        options: [development, preview, staging, production]
      platform:
        description: 'Plataforma'
        type: choice
        default: android
        options: [android, ios, all]
      submit:
        description: 'Enviar a la tienda al terminar (Pruebas internas de Play / TestFlight; solo con staging o production)'
        type: boolean
        default: false

jobs:
  build:
    name: EAS Build (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Comprobar el token de Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN (expo.dev → Access tokens)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --filter "@volt/mobile..."
      - name: Lanzar la compilación en EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          profile="${{ inputs.profile }}"; platform="${{ inputs.platform }}"
          submit=false
          if [ "${{ inputs.submit }}" = "true" ] && { [ "$profile" = "production" ] || [ "$profile" = "staging" ]; }; then submit=true; fi
          # El envío a TestFlight sin intervención necesita `ascAppId` en el perfil de envío (tarea 9l del
          # dueño); sin él, iOS se compila igual y solo se omite su envío, sin fallar el flujo.
          ios_submit=$submit
          if [ "$submit" = "true" ] && [ "$platform" != "android" ] && [ "$(jq -r ".submit.\"$profile\".ios.ascAppId // empty" eas.json)" = "" ]; then
            ios_submit=false
            echo "::warning title=iOS sin envío::Falta ascAppId en el perfil de envío '$profile' de eas.json: iOS se compila pero no se envía a TestFlight."
          fi
          launch() { # plataforma auto_submit
            extra=""; [ "$2" = "true" ] && extra="--auto-submit"
            npx eas-cli@latest build --non-interactive --no-wait --profile "$profile" --platform "$1" $extra
          }
          if [ "$platform" = "all" ] && [ "$submit" != "$ios_submit" ]; then
            launch android "$submit"
            launch ios "$ios_submit"
          else
            launch "$platform" "$submit"
          fi
          echo "La compilación sigue en https://expo.dev (proyecto Volt → Builds)." >> "$GITHUB_STEP_SUMMARY"
