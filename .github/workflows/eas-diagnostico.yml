# Diagnóstico de una compilación de EAS: imprime estado, fase y mensaje de error de un build por su id
# y el final de sus registros (con las claves enmascaradas). Se lanza a mano; no expone secretos.
name: Diagnóstico de compilación (EAS)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Id de la compilación en EAS (vacío: la más reciente de Android)'
        type: string
        required: false
        default: ''
      phases:
        description: 'Fases del registro que se imprimen completas (separadas por comas)'
        type: string
        required: false
        default: 'INSTALL_DEPENDENCIES,RUN_EXPO_DOCTOR,PREBUILD,EAGER_BUNDLE,CALCULATE_EXPO_UPDATES_RUNTIME_VERSION,CONFIGURE_EXPO_UPDATES'

jobs:
  view:
    name: Estado de la compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@volt/mobile..."
      - name: Consultar la compilación
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          # build:view solo acepta --json (no --non-interactive); build:list acepta ambos.
          if [ -n "$BUILD_ID" ]; then
            npx eas-cli@latest build:view "$BUILD_ID" --json > build.json
          else
            npx eas-cli@latest build:list --platform android --limit 1 --json --non-interactive | jq '.[0]' > build.json
          fi
          resumen="$(jq '{id, status, platform, buildProfile, appVersion, appBuildVersion, sdkVersion, runtimeVersion, error, createdAt, completedAt}' build.json)"
          {
            echo "## Compilación $(jq -r '.id' build.json)"
            echo ""
            echo '```json'
            echo "$resumen"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$resumen"
      - name: Final de los registros de la compilación
        working-directory: apps/mobile
        shell: bash {0}
        env:
          PHASES: ${{ inputs.phases }}
        run: |
          set +e
          mask() { sed -E 's/AIza[0-9A-Za-z_-]{35}/[clave]/g; s/(EXPO_TOKEN|GOOGLE_MAPS_ANDROID_API_KEY)=[^ ]+/\1=[oculto]/g' | cut -c1-600; }
          mapfile -t urls < <(jq -r '.logFiles[]? // empty' build.json)
          echo "Archivos de registro expuestos: ${#urls[@]}"
          if [ "${#urls[@]}" -eq 0 ]; then
            exit 0
          fi
          n=0
          for url in "${urls[@]}"; do
            n=$((n + 1))
            if ! curl -sSfL --compressed --max-time 60 "$url" -o "log-$n.raw"; then
              echo "No fue posible descargar el archivo de registro $n (se omite)."
              continue
            fi
            echo "Archivo $n: $(file -b "log-$n.raw" | cut -c1-120); $(wc -c < "log-$n.raw") bytes"
            # Los archivos pueden venir comprimidos (gzip) y en líneas JSON; se pasan a texto plano.
            if gzip -t "log-$n.raw" 2>/dev/null; then gzip -dc "log-$n.raw" > "log-$n.txt"; else cp "log-$n.raw" "log-$n.txt"; fi
            echo "Descomprimido: $(file -b "log-$n.txt" | cut -c1-120); $(wc -l < "log-$n.txt") líneas"
            if head -c 1 "log-$n.txt" | grep -q '{'; then
              echo "Claves de la primera línea JSON: $(head -n 1 "log-$n.txt" | jq -r 'keys | join(",")' 2>/dev/null)"
              echo "Fases (líneas por fase):"
              jq -R -r 'fromjson? | select(. != null) | (.buildStepDisplayName // .phase // .buildPhase // "-")' "log-$n.txt" | uniq -c
              jq -R -r 'fromjson? | select(. != null) | "[\(.buildStepDisplayName // .phase // .buildPhase // "-")] \(.msg // .message // .text // "")"' "log-$n.txt" > "log-$n.plain"
            else
              cp "log-$n.txt" "log-$n.plain"
            fi
            total=$(wc -l < "log-$n.plain")
            {
              echo "### Registro $n ($total líneas)"
              echo ""
              echo "Fases completas (${PHASES:-ninguna}, máximo 400 líneas):"
              echo '```'
              if [ -n "${PHASES:-}" ]; then
                grep -a -E "^\\[(${PHASES//,/|})\\]" "log-$n.plain" | head -n 400 | mask
              fi
              echo '```'
              echo ""
              echo "Primeras 5 líneas:"
              echo '```'
              head -n 5 "log-$n.plain" | mask
              echo '```'
              echo ""
              echo "Líneas con indicios de error (máximo 150):"
              echo '```'
              grep -a -n -E 'What went wrong|FAILED|BUILD FAILED|error:|Error:|Exception|Could not|OutOfMemory|ENOENT|not found|Unresolved|does not exist' "log-$n.plain" | tail -n 150 | mask
              echo '```'
              echo ""
              echo "Últimas 200 líneas:"
              echo '```'
              tail -n 200 "log-$n.plain" | mask
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - name: Estado final
        working-directory: apps/mobile
        run: |
          echo "ESTADO: $(jq -r '"\(.status) | perfil \(.buildProfile) | versionCode \(.appBuildVersion) | error \(.error.errorCode // "ninguno") | creado \(.createdAt) | terminado \(.completedAt // "-")"' build.json)"
