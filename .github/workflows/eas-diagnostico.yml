# Diagnóstico de una compilación de EAS: imprime estado, fase y mensaje de error de un build por su id
# y el final de sus registros (con las claves enmascaradas). Con `list` solo lista las últimas
# compilaciones; con `submissions` lista los últimos envíos a las tiendas (TestFlight y Play) leyendo la
# API de EAS con el token de Expo. Se lanza a mano; no expone secretos.
name: Diagnóstico de compilación (EAS)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Id de la compilación en EAS (vacío: la más reciente de Android)'
        type: string
        required: false
        default: ''
      phases:
        description: 'Fases del registro que se imprimen completas (separadas por comas)'
        type: string
        required: false
        default: 'INSTALL_DEPENDENCIES,RUN_EXPO_DOCTOR,PREBUILD,EAGER_BUNDLE,CALCULATE_EXPO_UPDATES_RUNTIME_VERSION,CONFIGURE_EXPO_UPDATES'
      list:
        description: 'Solo listar las últimas compilaciones de Android e iOS (estado, perfil, versión), sin registros'
        type: boolean
        required: false
        default: false
      submissions:
        description: 'Solo listar los últimos envíos a las tiendas (TestFlight y Pruebas internas de Play), sin registros'
        type: boolean
        required: false
        default: false

jobs:
  view:
    name: Estado de la compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@volt/mobile..."
      - name: Últimas compilaciones de Android e iOS
        if: inputs.list
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          for platform in android ios; do
            npx eas-cli@latest build:list --platform "$platform" --limit 4 --json --non-interactive > "builds-$platform.json"
            tabla="$(jq -r '.[] | "| \(.id[0:8]) | \(.platform) | \(.buildProfile) | \(.status) | \(.appVersion) (\(.appBuildVersion)) | \(.createdAt[0:16]) | \(.completedAt // "" | .[0:16]) |"' "builds-$platform.json")"
            {
              echo "## Compilaciones de $platform"
              echo ""
              echo "| Id | Plataforma | Perfil | Estado | Versión (build) | Creada | Terminada |"
              echo "|---|---|---|---|---|---|---|"
              echo "$tabla"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Compilaciones de $platform::$(jq -c '[.[] | {id: .id[0:8], profile: .buildProfile, status, version: .appVersion, build: .appBuildVersion}]' "builds-$platform.json")"
          done
      - name: Últimos envíos a las tiendas
        if: inputs.submissions
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # La CLI no lista envíos; se consulta la API GraphQL de EAS con el mismo token.
          project=$(jq -r '.expo.extra.eas.projectId' app.json)
          query='query($appId: String!, $platform: AppPlatform!) { app { byId(appId: $appId) { submissions(offset: 0, limit: 5, filter: { platform: $platform }) { id platform status createdAt completedAt error { errorCode message } submittedBuild { id appVersion appBuildVersion } logFiles } } } }'
          for platform in IOS ANDROID; do
            jq -cn --arg q "$query" --arg id "$project" --arg p "$platform" '{query: $q, variables: {appId: $id, platform: $p}}' > query.json
            curl -sS --max-time 60 -H "Authorization: Bearer $EXPO_TOKEN" -H 'content-type: application/json' https://api.expo.dev/graphql -d @query.json > "submissions-$platform.json"
            if jq -e '.errors' "submissions-$platform.json" >/dev/null 2>&1; then
              echo "::error::EAS respondió con error: $(jq -c '.errors' "submissions-$platform.json" | head -c 600)"; exit 1
            fi
          done
          jq -s '{data: {app: {byId: {submissions: (map(.data.app.byId.submissions) | add)}}}}' submissions-IOS.json submissions-ANDROID.json > submissions.json
          tabla="$(jq -r '.data.app.byId.submissions[] | "| \(.id[0:8]) | \(.platform) | \(.status) | \((.submittedBuild.id // "-")[0:8]) (\(.submittedBuild.appVersion // "-") · \(.submittedBuild.appBuildVersion // "-")) | \(.createdAt[0:16]) | \((.completedAt // "")[0:16]) | \(.error.errorCode // "") \((.error.message // "")[0:200]) |"' submissions.json)"
          {
            echo "## Envíos a las tiendas (los 10 últimos)"
            echo ""
            echo "| Id | Plataforma | Estado | Compilación (versión · build) | Creado | Terminado | Error |"
            echo "|---|---|---|---|---|---|---|"
            echo "$tabla"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Envíos a las tiendas::$(jq -c '[.data.app.byId.submissions[] | {id: .id[0:8], platform, status, build: (.submittedBuild.id // "-")[0:8], error: .error.errorCode, message: ((.error.message // "")[0:300])}]' submissions.json)"
          # Para los envíos con error, el final de cada archivo de registro (líneas JSON a texto, sin claves).
          mask() { sed -E 's/AIza[0-9A-Za-z_-]{35}/[clave]/g' | cut -c1-600; }
          jq -r '.data.app.byId.submissions[] | select(.status == "ERRORED") | .id as $id | .logFiles[] | "\($id) \(.)"' submissions.json | while read -r id url; do
            [ -n "$url" ] || continue
            echo "::group::Registro del envío $id ($(basename "$url" | cut -c1-60); últimas 80 líneas)"
            if curl -sSfL --compressed --max-time 60 "$url" -o sub.log; then
              if gzip -t sub.log 2>/dev/null; then gzip -dc sub.log > sub.txt; else mv sub.log sub.txt; fi
              jq -R -r 'fromjson? // {msg: .} | "[\(.phase // "-")] \(.msg // .message // "")"' sub.txt | tail -n 80 | mask
            else
              echo "No fue posible descargar el registro."
            fi
            echo "::endgroup::"
          done
      - name: Consultar la compilación
        if: ${{ !inputs.list && !inputs.submissions }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          # build:view solo acepta --json (no --non-interactive); build:list acepta ambos.
          if [ -n "$BUILD_ID" ]; then
            npx eas-cli@latest build:view "$BUILD_ID" --json > build.json
          else
            npx eas-cli@latest build:list --platform android --limit 1 --json --non-interactive | jq '.[0]' > build.json
          fi
          resumen="$(jq '{id, status, platform, buildProfile, appVersion, appBuildVersion, sdkVersion, runtimeVersion, error, createdAt, completedAt}' build.json)"
          {
            echo "## Compilación $(jq -r '.id' build.json)"
            echo ""
            echo '```json'
            echo "$resumen"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$resumen"
      - name: Final de los registros de la compilación
        if: ${{ !inputs.list && !inputs.submissions }}
        working-directory: apps/mobile
        shell: bash {0}
        env:
          PHASES: ${{ inputs.phases }}
        run: |
          set +e
          mask() { sed -E 's/AIza[0-9A-Za-z_-]{35}/[clave]/g; s/(EXPO_TOKEN|GOOGLE_MAPS_ANDROID_API_KEY)=[^ ]+/\1=[oculto]/g' | cut -c1-600; }
          mapfile -t urls < <(jq -r '.logFiles[]? // empty' build.json)
          echo "Archivos de registro expuestos: ${#urls[@]}"
          if [ "${#urls[@]}" -eq 0 ]; then
            exit 0
          fi
          n=0
          for url in "${urls[@]}"; do
            n=$((n + 1))
            if ! curl -sSfL --compressed --max-time 60 "$url" -o "log-$n.raw"; then
              echo "No fue posible descargar el archivo de registro $n (se omite)."
              continue
            fi
            echo "Archivo $n: $(file -b "log-$n.raw" | cut -c1-120); $(wc -c < "log-$n.raw") bytes"
            # Los archivos pueden venir comprimidos (gzip) y en líneas JSON; se pasan a texto plano.
            if gzip -t "log-$n.raw" 2>/dev/null; then gzip -dc "log-$n.raw" > "log-$n.txt"; else cp "log-$n.raw" "log-$n.txt"; fi
            echo "Descomprimido: $(file -b "log-$n.txt" | cut -c1-120); $(wc -l < "log-$n.txt") líneas"
            if head -c 1 "log-$n.txt" | grep -q '{'; then
              echo "Claves de la primera línea JSON: $(head -n 1 "log-$n.txt" | jq -r 'keys | join(",")' 2>/dev/null)"
              echo "Fases (líneas por fase):"
              jq -R -r 'fromjson? | select(. != null) | (.buildStepDisplayName // .phase // .buildPhase // "-")' "log-$n.txt" | uniq -c
              jq -R -r 'fromjson? | select(. != null) | "[\(.buildStepDisplayName // .phase // .buildPhase // "-")] \(.msg // .message // .text // "")"' "log-$n.txt" > "log-$n.plain"
            else
              cp "log-$n.txt" "log-$n.plain"
            fi
            total=$(wc -l < "log-$n.plain")
            {
              echo "### Registro $n ($total líneas)"
              echo ""
              echo "Fases completas (${PHASES:-ninguna}, máximo 400 líneas):"
              echo '```'
              if [ -n "${PHASES:-}" ]; then
                grep -a -E "^\\[(${PHASES//,/|})\\]" "log-$n.plain" | head -n 400 | mask
              fi
              echo '```'
              echo ""
              echo "Primeras 5 líneas:"
              echo '```'
              head -n 5 "log-$n.plain" | mask
              echo '```'
              echo ""
              echo "Líneas con indicios de error (máximo 150):"
              echo '```'
              grep -a -n -E 'What went wrong|FAILED|BUILD FAILED|error:|Error:|Exception|Could not|OutOfMemory|ENOENT|not found|Unresolved|does not exist' "log-$n.plain" | tail -n 150 | mask
              echo '```'
              echo ""
              echo "Últimas 200 líneas:"
              echo '```'
              tail -n 200 "log-$n.plain" | mask
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - name: Estado final
        if: ${{ !inputs.list && !inputs.submissions }}
        working-directory: apps/mobile
        run: |
          echo "ESTADO: $(jq -r '"\(.status) | perfil \(.buildProfile) | versionCode \(.appBuildVersion) | error \(.error.errorCode // "ninguno") | creado \(.createdAt) | terminado \(.completedAt // "-")"' build.json)"
