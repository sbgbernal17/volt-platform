# Comprueba la API de un ambiente desde fuera sin entrar a la consola: revisión lista, entrada
# efectiva y respuesta de /healthz por la URL heredada y la determinista de Cloud Run (con token de
# identidad de la cuenta de despliegue) y, si se indica, por el balanceador (api-<env>.<dominio>).
name: Comprobación de la API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente'
        type: choice
        default: dev
        options: [dev, staging, prod]
      via_lb:
        description: 'Probar también por el balanceador (requiere DNS y certificado)'
        type: boolean
        default: false
      probe_hello:
        description: 'Desplegar un servicio de prueba (hello-probe) y comprobar su URL *.run.app; se borra al final'
        type: boolean
        default: false
      probe_vpc:
        description: 'hello-probe con la misma red que la API (egreso directo a la VPC)'
        type: boolean
        default: false
      reset_ingress:
        description: 'Reaplicar la entrada de la API (internal → all) para forzar el registro de sus URL en el borde'
        type: boolean
        default: false
      probe_image:
        description: 'hello-probe con la imagen de la API (sin secretos) en vez de la imagen hello de Google'
        type: boolean
        default: false
      reset_url:
        description: 'Deshabilitar y volver a habilitar la URL por defecto de la API para forzar su registro en el borde'
        type: boolean
        default: false
      probe_name:
        description: 'Nombre del servicio de prueba (para comprobar si el nombre afecta al enrutamiento)'
        type: string
        default: 'hello-probe'
      probe_like_api:
        description: 'hello-probe con etiquetas, cuenta de servicio, tiempo de espera y escalado iguales a los de la API'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: ${{ inputs.environment }}
  REGION: us-central1
  DOMAIN: supercargadores.co

jobs:
  comprobar:
    name: Comprobar API (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: vars
        run: echo "suffix=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
      - name: Autenticación (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', steps.vars.outputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', steps.vars.outputs.suffix)] }}
          project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: URLs y estado del servicio
        id: svc
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
        run: |
          set -euo pipefail
          number=$(gcloud projects describe "$PROJECT_ID" --format 'value(projectNumber)')
          legacy=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          det="https://api-${number}.${REGION}.run.app"
          ready=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(status.conditions[0].type,status.conditions[0].status)' | tr '\t' '=')
          ingress=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(metadata.annotations."run.googleapis.com/ingress",metadata.annotations."run.googleapis.com/ingress-status")' | tr '\t' '/')
          urls=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(status.address.url)')
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"; echo "det=$det" >> "$GITHUB_OUTPUT"
          echo "::notice title=Servicio api::$ready entrada=$ingress url=$legacy address=$urls determinista=$det"
          ann=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(metadata.annotations)' | tr ';' ' ' | cut -c1-900)
          echo "::notice title=Anotaciones del servicio::${ann:-ninguna}"
          gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'yaml(metadata.annotations,spec.template.metadata.annotations,status.url,status.address)'
          # Campos de la API v2 que la vista v1 no muestra (URL por defecto deshabilitada, IAP, invoker IAM).
          v2=$(curl -sS --max-time 20 -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/api" \
            | jq -c '{uri, urls, ingress, defaultUriDisabled, iapEnabled, invokerIamDisabled, launchStage, reconciling, terminalCondition: .terminalCondition.type, terminalState: .terminalCondition.state}')
          echo "::notice title=Servicio api (API v2)::${v2:-sin respuesta}"
          echo "$v2"
          # Certificados de los dos balanceadores (se emiten cuando el DNS apunta a las IP).
          web=$(gcloud certificate-manager certificates describe "volt-${ENVIRONMENT}-web" --location global --project "$PROJECT_ID" --format 'value(managed.state,managed.domains,managed.provisioningIssue,managed.authorizationAttemptInfo)' 2>&1 | tr '\t' ' ' | head -c 900)
          ocpp=$(gcloud compute ssl-certificates describe "volt-${ENVIRONMENT}-ocpp" --global --project "$PROJECT_ID" --format 'value(managed.status,managed.domainStatus)' 2>&1 | tr '\t' ' ' | head -c 300)
          echo "::notice title=Certificados::web=${web:-?} | ocpp=${ocpp:-?}"
          for h in api admin app ocpp; do
            if [ "$ENVIRONMENT" = "prod" ]; then host="$h.$DOMAIN"; else host="$h-$ENVIRONMENT.$DOMAIN"; fi
            ip=$(getent hosts "$host" | awk '{print $1}' | head -1)
            echo "DNS $host -> ${ip:-sin resolver}"
          done
      - name: Token para la URL heredada
        id: tok_legacy
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', steps.vars.outputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', steps.vars.outputs.suffix)] }}
          project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          token_format: id_token
          id_token_audience: ${{ steps.svc.outputs.legacy }}
          id_token_include_email: true
      - name: Token para la URL determinista
        id: tok_det
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', steps.vars.outputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', steps.vars.outputs.suffix)] }}
          project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          token_format: id_token
          id_token_audience: ${{ steps.svc.outputs.det }}
          id_token_include_email: true
      - name: Peticiones a /healthz
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          LEGACY: ${{ steps.svc.outputs.legacy }}
          DET: ${{ steps.svc.outputs.det }}
          TOK_LEGACY: ${{ steps.tok_legacy.outputs.id_token }}
          TOK_DET: ${{ steps.tok_det.outputs.id_token }}
          VIA_LB: ${{ inputs.via_lb }}
          RESET_INGRESS: ${{ inputs.reset_ingress }}
          RESET_URL: ${{ inputs.reset_url }}
        run: |
          set +e
          probe() { # nombre url [token]
            if [ -n "${3:-}" ]; then code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $3" "$2"); else code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$2"); fi
            body=$(head -c 160 /tmp/body 2>/dev/null | sed 's/<[^>]*>//g' | tr '\n' ' ')
            echo "::notice title=$1::$2 -> $code ${body}"
            echo "$1: $code"
          }
          # Contexto de red y de la organización cuando la URL directa responde 404.
          host=${LEGACY#https://}
          echo "::group::DNS y cabeceras de $host"
          getent hosts "$host" || true
          curl -sSI --max-time 20 "$LEGACY/healthz" | head -20 || true
          echo "::endgroup::"
          echo "::group::Descripción completa del servicio api"
          gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format yaml | grep -v -i 'token\|password' | head -150
          echo "::endgroup::"
          echo "::group::Registros del contenedor de la API (últimas 2 h, avisos y errores)"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="api" AND severity>=WARNING' --project "$PROJECT_ID" --freshness=2h --limit 10 --format 'value(timestamp,severity,textPayload,jsonPayload.message)' || true
          echo "::endgroup::"
          echo "::group::Registros de peticiones de Cloud Run (última hora, cualquier URL)"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="api" AND httpRequest.requestMethod:*' --project "$PROJECT_ID" --freshness=1h --limit 10 --format 'value(timestamp,httpRequest.status,httpRequest.requestUrl,textPayload)' || true
          echo "::endgroup::"
          echo "::group::Políticas de organización efectivas (candidatas)"
          for c in run.allowedIngress run.managed.requireInvokerIam run.allowedVPCEgress run.disableDefaultUrl run.managed.disableDefaultUrl iam.allowedPolicyMemberDomains gcp.restrictServiceUsage compute.restrictLoadBalancerCreationForTypes; do
            echo "--- $c"; gcloud org-policies describe "$c" --project "$PROJECT_ID" --effective --format yaml 2>&1 | head -20
          done
          gcloud org-policies list --project "$PROJECT_ID" --format 'value(constraint)' 2>&1 | head -20
          echo "::endgroup::"
          if [ "$RESET_URL" = "true" ]; then
            echo "::group::Reaplicando la URL por defecto de la API"
            gcloud run services update api --region "$REGION" --project "$PROJECT_ID" --no-default-url --quiet 2>&1 | tail -2
            sleep 20
            gcloud run services update api --region "$REGION" --project "$PROJECT_ID" --default-url --quiet 2>&1 | tail -2
            sleep 45
            echo "::endgroup::"
          fi
          if [ "$RESET_INGRESS" = "true" ]; then
            echo "::group::Reaplicando la entrada de la API"
            gcloud run services update api --region "$REGION" --project "$PROJECT_ID" --ingress internal --quiet 2>&1 | tail -2
            sleep 15
            gcloud run services update api --region "$REGION" --project "$PROJECT_ID" --ingress all --quiet 2>&1 | tail -2
            sleep 45
            echo "::endgroup::"
          fi
          probe "heredada sin token" "$LEGACY/healthz"
          probe "heredada con token" "$LEGACY/healthz" "$TOK_LEGACY"
          probe "determinista sin token" "$DET/healthz"
          probe "determinista con token" "$DET/healthz" "$TOK_DET"
          if [ "$VIA_LB" = "true" ]; then
            if [ "$ENVIRONMENT" = "prod" ]; then host="api.$DOMAIN"; ocpp="ocpp.$DOMAIN"; else host="api-$ENVIRONMENT.$DOMAIN"; ocpp="ocpp-$ENVIRONMENT.$DOMAIN"; fi
            probe "balanceador web (api)" "https://$host/healthz"
            probe "balanceador ocpp (gateway)" "https://$ocpp/healthz"
            # Iteración 9: página de acción de los correos y logotipo en la app web, clave de mapas en el
            # back-office (enmascarada) y estaciones visibles en la app (estación de pruebas virtual).
            if [ "$ENVIRONMENT" = "prod" ]; then app="app.$DOMAIN"; admin="admin.$DOMAIN"; else app="app-$ENVIRONMENT.$DOMAIN"; admin="admin-$ENVIRONMENT.$DOMAIN"; fi
            probe "app web (página de acción de correos)" "https://$app/auth/action"
            probe "app web (logotipo para correos)" "https://$app/brand/volt-logo-blanco.png"
            cfg=$(curl -sS --max-time 20 "https://$admin/config.js" | sed -E 's/(googleMapsApiKey: ")([A-Za-z0-9_-]{6})[^"]*"/\1\2…"/')
            echo "::notice title=back-office config.js::${cfg:-sin respuesta}"
            curl -sS --max-time 20 "https://$host/v1/locations" > /tmp/locations.json || true
            loc=$(python3 - <<'PY'
          import json
          try:
              items = json.load(open('/tmp/locations.json')).get('items', [])
              text = '; '.join(
                  f"{l['name']} ({l.get('city') or '-'}): "
                  + (', '.join(
                      f"{e['evseId']} {e['status']} {e['maxPowerKw']} kW"
                      + (f" mínimo {(e.get('tariff') or {}).get('minPrice')}" if (e.get('tariff') or {}).get('minPrice') else '')
                      for e in l['evses']) or 'sin conectores')
                  for l in items
              )
              print(text or 'sin estaciones visibles')
          except Exception as error:
              print(f'error: {error}')
          PY
          )
            echo "::notice title=Estaciones visibles en la app (/v1/locations)::${loc}"
            curl -sS --max-time 20 "https://$host/v1/config" > /tmp/config.json || true
            maps=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/config.json'))
              key = (d.get('maps') or {}).get('browserKey')
              maps = f"clave de Google Maps presente ({key[:6]}…)" if key else 'sin clave de Google Maps'
              print(f"{maps}; correo: {d.get('email')}; celular: {d.get('phone')}; pagos: {(d.get('payments') or {}).get('provider')}/{(d.get('payments') or {}).get('environment')}")
          except Exception as error:
              print(f'error: {error}')
          PY
          )
            echo "::notice title=Config pública de la app (/v1/config)::${maps}"
            echo "::group::Cargador sintético y alarmas (últimos 30 min)"
            gcloud logging read 'jsonPayload.event="synthetic.cycle"' --project "$PROJECT_ID" --freshness=30m --limit 3 --format 'value(timestamp,jsonPayload.result,jsonPayload.message)' || true
            gcloud logging read 'jsonPayload.event="alarm.raised" OR jsonPayload.event="alarm.resolved"' --project "$PROJECT_ID" --freshness=6h --limit 6 --format 'value(timestamp,jsonPayload.event,jsonPayload.kind,jsonPayload.message)' || true
            echo "::endgroup::"
            cyc=$(gcloud logging read 'jsonPayload.event="synthetic.cycle"' --project "$PROJECT_ID" --freshness=30m --limit 3 --format 'value(timestamp,jsonPayload.result)' 2>/dev/null | tr '\t' '=' | tr '\n' ' ')
            echo "::notice title=Ciclos del cargador sintético::${cyc:-sin ciclos en 30 min}"
          fi
      - name: Servicio de prueba hello-probe
        if: inputs.probe_hello
        id: hello
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          PROBE_VPC: ${{ inputs.probe_vpc }}
          PROBE_IMAGE: ${{ inputs.probe_image }}
          PROBE_NAME: ${{ inputs.probe_name }}
          PROBE_LIKE_API: ${{ inputs.probe_like_api }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$PROBE_VPC" = "true" ]; then
            net=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(spec.template.metadata.annotations."run.googleapis.com/network-interfaces")')
            network=$(echo "$net" | jq -r '.[0].network' | sed 's#.*/##'); subnet=$(echo "$net" | jq -r '.[0].subnetwork' | sed 's#.*/##')
            extra="--network $network --subnet $subnet --vpc-egress private-ranges-only"
            echo "hello-probe con red: $extra"
          fi
          image="us-docker.pkg.dev/cloudrun/container/hello"
          if [ "$PROBE_LIKE_API" = "true" ]; then
            sa=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(spec.template.spec.serviceAccountName)')
            extra="$extra --service-account $sa --timeout 3600 --max-instances 10 --cpu 1 --memory 512Mi --concurrency 80 --labels app=volt,env=$ENVIRONMENT,managed-by=terraform,goog-terraform-provisioned=true"
            echo "hello-probe como la API: $extra"
          fi
          if [ "$PROBE_IMAGE" = "true" ]; then
            image=$(gcloud run services describe api --region "$REGION" --project "$PROJECT_ID" --format 'value(spec.template.spec.containers[0].image)')
            extra="$extra --set-env-vars NODE_ENV=production,VOLT_ENV=dev,LOG_LEVEL=info,API_PORT=8080,API_HOST=0.0.0.0 --port 8080"
            echo "hello-probe con la imagen de la API: $image"
          fi
          gcloud run deploy "$PROBE_NAME" --image "$image" --region "$REGION" \
            --project "$PROJECT_ID" --ingress all --no-allow-unauthenticated --quiet $extra >/dev/null
          url=$(gcloud run services describe "$PROBE_NAME" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "$PROBE_NAME: $url"
      - name: Token para hello-probe
        if: inputs.probe_hello
        id: tok_hello
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', steps.vars.outputs.suffix)] }}
          service_account: ${{ vars[format('GCP_DEPLOYER_SA_{0}', steps.vars.outputs.suffix)] }}
          project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          token_format: id_token
          id_token_audience: ${{ steps.hello.outputs.url }}
          id_token_include_email: true
      - name: Peticiones a hello-probe
        if: inputs.probe_hello
        env:
          HELLO: ${{ steps.hello.outputs.url }}
          TOK: ${{ steps.tok_hello.outputs.id_token }}
        run: |
          set +e
          for i in 1 2 3; do
            c1=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$HELLO/"); c2=$(curl -sS -o /tmp/h -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $TOK" "$HELLO/")
            echo "::notice title=hello-probe (intento $i)::$HELLO -> sin token $c1, con token $c2 $(head -c 80 /tmp/h | sed 's/<[^>]*>//g' | tr '\n' ' ')"
            sleep 20
          done
      - name: Diferencias entre api y el servicio de prueba (API v2)
        if: inputs.probe_hello
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
          PROBE_NAME: ${{ inputs.probe_name }}
        run: |
          set +e
          tok=$(gcloud auth print-access-token)
          norm() { jq -S 'del(.name, .uid, .generation, .createTime, .updateTime, .creator, .lastModifier, .etag, .observedGeneration, .latestReadyRevision, .latestCreatedRevision, .terminalCondition, .conditions, .traffic, .trafficStatuses, .uri, .urls, .template.revision, .template.containers[].image, .template.containers[].env) | walk(if type == "object" then with_entries(select(.value != null)) else . end)'; }
          curl -sS -H "Authorization: Bearer $tok" "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/api" | norm > /tmp/api.json
          curl -sS -H "Authorization: Bearer $tok" "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/$PROBE_NAME" | norm > /tmp/probe.json
          echo "::group::api (API v2, normalizado)"; cat /tmp/api.json; echo "::endgroup::"
          echo "::group::$PROBE_NAME (API v2, normalizado)"; cat /tmp/probe.json; echo "::endgroup::"
          echo "::group::diff api vs $PROBE_NAME"; diff /tmp/api.json /tmp/probe.json; echo "::endgroup::"
      - name: Borrar hello-probe
        if: always() && inputs.probe_hello
        env:
          PROJECT_ID: ${{ vars[format('GCP_PROJECT_ID_{0}', steps.vars.outputs.suffix)] }}
        run: gcloud run services delete "${{ inputs.probe_name }}" --region "$REGION" --project "$PROJECT_ID" --quiet || true
